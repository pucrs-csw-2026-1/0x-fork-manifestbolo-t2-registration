services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    env_file:
      - .env
    environment:
      # Dentro do container, o Auth Service é alcançado pela porta publicada no
      # host (8080). host.docker.internal resolve para o host (host-gateway), de
      # modo que NÃO dependemos da rede interna do compose do Auth (0X).
      # Pré-requisito: o Auth precisa estar no ar publicando a porta 8080.
      - AUTH_SERVICE_BASE_URL=http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: app-db
    env_file:
      - .env
    # Sem mapeamento de porta no host: o app fala com o Postgres pela rede do
    # Compose (db:5432). Evita conflito com um Postgres local na 5432.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
